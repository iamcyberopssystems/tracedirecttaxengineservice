name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Engine integrity, tests, dependency audit
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (checkout v4, setup-node v4, setup-python v5).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Engine pin tooling tests
        run: cd engine && python -m unittest -v test_verify_engine
      - name: Fetch, verify and build the pinned engine
        run: bash scripts/build-engine.sh
      - name: Service tests
        run: npm test
      - name: Audit shipped engine dependencies (OSV)
        run: |
          cd build/engine
          COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm --filter @dtax/tax-engine deploy --prod --ignore-scripts "$RUNNER_TEMP/deploy"
          cd "$GITHUB_WORKSPACE"
          python scripts/audit_runtime.py "$RUNNER_TEMP/deploy"
      - name: Static analysis (semgrep)
        run: |
          python -m pip install --quiet semgrep==1.183.0
          semgrep scan --config p/javascript --config p/nodejs --config p/github-actions --config p/dockerfile --error --metrics=off src scripts .github Dockerfile

  image:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build image
        run: docker build -t engine-service:ci .
      - name: Run and call it
        run: |
          TOKEN=$(openssl rand -hex 32)
          docker run -d --name svc -p 8080:8080 -e ENGINE_SERVICE_TOKEN="$TOKEN" engine-service:ci
          bash scripts/smoke.sh http://localhost:8080 "$TOKEN"
          test "$(docker exec svc id -u)" != 0
      - name: Logs
        if: always()
        run: docker logs svc || true
